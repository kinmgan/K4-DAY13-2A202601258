service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: P95 dưới 3 giây giúp chatbot phản hồi tốt và khớp với ngưỡng cảnh báo trên dashboard.
  error_rate_pct:
    objective: 2
    target: 99.0
  daily_cost_usd:
    objective: 2.5
    target: 100.0
    note: Ngưỡng bảo vệ ngân sách hằng ngày; cần kiểm tra token hoặc thay đổi model trước khi vượt ngân sách.
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: Quality trong lab là chỉ số proxy theo heuristic; môi trường production nên dùng phản hồi người dùng hoặc evaluator.
